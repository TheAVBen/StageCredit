<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2b3b">
<!-- Scripts external (remote-app.js): script-src 'self' only. style-src still needs
     'unsafe-inline' for the page <style> block. connect-src 'self' covers the
     same-origin WebSocket; no remote origins, no eval. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>StageCredit — Remote</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #2c2b3b; color: #f2f2f2; padding: 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .brand { font-size: 13px; font-weight: 700; text-transform: lowercase; }
  .brand span { color: #ffcc02; font-size: .5em; font-weight: 800; vertical-align: .75em; }
  .conn { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #6f6e80; }
  .conn.ok { color: #3ddc84; }
  .conn.bad { color: #ff4d4f; }

  .clock {
    background: #111; border-radius: 12px; padding: 12px 14px 14px;
    border-left: 5px solid #9b9aad; font-variant-numeric: tabular-nums;
  }
  .clock.running { border-left-color: #3ddc84; }
  .clock.paused { border-left-color: #ffcc02; }
  .clock.over { border-left-color: #ff4d4f; }
  .state { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: #9b9aad; }
  .clock.running .state { color: #3ddc84; }
  .clock.paused .state { color: #ffcc02; }
  .clock.over .state { color: #ff4d4f; }
  .big { font-size: clamp(56px, 22vw, 130px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .cuenm { font-size: 12px; color: #9b9aad; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  button {
    border: none; border-radius: 10px; background: #454458; color: #f2f2f2;
    font-family: inherit; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; font-size: 14px; padding: 18px 10px; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button:disabled { background: #3a3948; color: #6f6e80; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  .start { background: #ffcc02; color: #111; flex: 2.2; font-size: 17px; padding: 24px 10px; }
  .pause { background: #f2f2f2; color: #111; flex: 2.2; font-size: 17px; padding: 24px 10px; }
  .quick { background: #23222f; font-size: 12px; padding: 14px 6px; }
  .on { background: #ffcc02; color: #111; }
  .danger { background: #ff4d4f; color: #fff; }
  label {
    display: block; font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 700; color: #9b9aad; margin: 16px 0 6px;
  }
  .nextbar { margin-top: 8px; background: #23222f; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .nextbar .m { flex: 1; min-width: 0; }
  .nextbar .l { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #9b9aad; font-weight: 700; }
  .nextbar .v { font-size: 13px; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #go { flex: 0 0 auto; padding: 16px 24px; background: #ffcc02; color: #111; }

  .cue {
    display: flex; align-items: center; gap: 8px; background: #23222f;
    border-radius: 8px; padding: 12px 10px; margin-bottom: 6px;
    border-left: 3px solid transparent;
  }
  .cue.active { border-left-color: #3ddc84; background: #2a2937; }
  .cue .i { font-size: 11px; color: #6f6e80; width: 16px; flex: 0 0 auto; }
  .cue .n { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cue .d { font-size: 12px; color: #9b9aad; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #454458; border-radius: 18px; padding: 12px 16px; font-size: 12px; }
  .onair { font-size: 11px; color: #ffcc02; background: #332d14; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-weight: 700; display: none; }
  .onair.show { display: block; }
  .note { font-size: 11px; color: #6f6e80; line-height: 1.5; margin-top: 14px; }
  .empty { font-size: 12px; color: #6f6e80; padding: 8px 0; }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">soundcredit<span>.tv</span> remote</span>
    <span class="conn" id="conn">connecting</span>
  </div>

  <div class="clock" id="clockBox">
    <div class="state" id="stateLbl">—</div>
    <div class="big" id="big">--:--</div>
    <div class="cuenm" id="cueNm"></div>
  </div>

  <div class="row">
    <button class="start" id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div class="row">
    <button class="quick" id="tod">TOD</button>
    <button class="quick" id="blank">Blank</button>
    <button class="quick" data-add="-60">−1</button>
    <button class="quick" data-add="60">+1</button>
    <button class="quick" data-add="300">+5</button>
  </div>

  <div class="nextbar">
    <div class="m"><div class="l">Next</div><div class="v" id="nextVal">—</div></div>
    <button id="go" disabled>GO</button>
  </div>

  <label>Cue list</label>
  <div id="cues"><div class="empty">No cues</div></div>

  <label>Messages</label>
  <div class="onair" id="onair"></div>
  <div class="chips" id="msgs"></div>
  <div class="row"><button class="danger" id="clearMsg">Clear message</button></div>

  <div class="note" id="note"></div>

<script src="remote-app.js"></script>
</body>
</html>
