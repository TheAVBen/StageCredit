<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2b3b">
<!-- Scripts external (remote-app.js): script-src 'self' only. Styles in remote.css
     so style-src is 'self' (no page style block). connect-src 'self' for same-origin WS. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>StageCredit — Remote</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<link rel="stylesheet" href="remote.css">

</head>
<body>
  <div class="top">
    <span class="brand">soundcredit<span>.tv</span> remote</span>
    <span class="conn" id="conn">connecting</span>
  </div>

  <div class="clock" id="clockBox">
    <div class="state" id="stateLbl">—</div>
    <div class="big" id="big">--:--</div>
    <div class="cuenm" id="cueNm"></div>
  </div>

  <div class="row">
    <button class="start" id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div class="row">
    <button class="quick" id="tod">TOD</button>
    <button class="quick" id="blank">Blank</button>
    <button class="quick" data-add="-60">−1</button>
    <button class="quick" data-add="60">+1</button>
    <button class="quick" data-add="300">+5</button>
  </div>

  <div class="nextbar">
    <div class="m"><div class="l">Next</div><div class="v" id="nextVal">—</div></div>
    <button id="go" disabled>GO</button>
  </div>

  <label>Cue list</label>
  <div id="cues"><div class="empty">No cues</div></div>

  <label>Messages</label>
  <div class="onair" id="onair"></div>
  <div class="chips" id="msgs"></div>
  <div class="row"><button class="danger" id="clearMsg">Clear message</button></div>

  <div class="note" id="note"></div>

<script src="remote-app.js"></script>
</body>
</html>
