<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Scripts external (display-app.js): script-src 'self' only. Styles in display.css
     so style-src is 'self' (no page style block). connect-src 'self' for LAN WebSocket.
     img-src data: for logos when loaded as data URLs in Electron. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>StageCredit — Display</title>
<!-- Bundled locally; see the note in control-v2.html. No network, so no swap —
     which also means the message autofit measures the real font first time. -->
<link rel="stylesheet" href="fonts/montserrat.css">
<link rel="stylesheet" href="display.css">

</head>
<body>
  <!-- #stage is the layout canvas. In 1920×720 unsquish mode it is sized to the
       shorter screen and stretched to the window; see display-app.js. -->
  <div id="stage">
    <div id="paused">PAUSED</div>
    <div id="todClock"></div>
    <div id="cueTitle"></div>
    <div id="cueSub"></div>
    <div id="time">10:00</div>
    <div id="message"></div>
    <div id="nextUp"><span class="lab">Next</span><span id="nextUpName"></span></div>
    <div id="brand">soundcredit<span class="tv">.tv</span></div>
    <img id="logoImg" alt="">
    <div id="linkLost">Link lost</div>
  </div>

<script src="display-app.js"></script>
</body>
</html>
